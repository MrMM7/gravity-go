info:
  name: Shorten URL
  type: http
  seq: 1

http:
  method: POST
  url: localhost:8080/shorten
  body:
    type: json
    data: |-
      {
        "original_url": "https://google.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
