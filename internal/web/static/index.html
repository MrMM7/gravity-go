<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gravity — Minimalist URL shortener.">
  <meta name="theme-color" content="#0A0A0A">
  <title>Gravity</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Gravity</span>
      </a>
      <nav class="header-nav" aria-label="Account navigation">
        <a href="/auth" class="header-link" id="header-signin-link">Sign in</a>
        <a href="/auth?mode=signup" class="btn btn-secondary btn-sm" id="header-signup-link">Sign up</a>
      </nav>
    </header>

    <main class="main">
      <section class="section" aria-labelledby="shorten-title">
        <h1 id="shorten-title" class="title">Shorten a link</h1>
        <p class="subtitle">Paste a long URL to create a short, shareable link.</p>

        <form id="shorten-form" class="shorten-form" novalidate>
          <label for="shorten-input" class="sr-only">Destination URL</label>
          <div class="input-row">
            <input
              type="url"
              id="shorten-input"
              name="original_url"
              class="input"
              placeholder="https://example.com/very/long/url"
              autocomplete="url"
              autocapitalize="off"
              spellcheck="false"
              required
            >
            <button type="submit" id="shorten-submit" class="btn btn-primary">
              Shorten
            </button>
          </div>

          <p id="shorten-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        </form>

        <div id="output-result" class="result-card" aria-live="polite" hidden>
          <div class="result-main">
            <a
              id="result-short-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="result-link"
            ></a>
            <p id="result-orig-url" class="result-original"></p>
          </div>
          <div class="result-actions">
            <button type="button" id="copy-btn" class="btn btn-primary btn-sm">
              Copy
            </button>
            <a
              id="test-redirect-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-secondary btn-sm"
            >
              Visit
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Gravity</span>
    </footer>
  </div>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
