<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gravity — Precision minimalist URL shortener.">
  <meta name="theme-color" content="#09090B">
  <title>Gravity</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090B'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23FFFFFF' stroke-opacity='0.28' stroke-width='1.25'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23FFFFFF'/%3E%3Ccircle cx='23.5' cy='9.5' r='1.75' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Atmospheric Monochrome Background Layer -->
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-spotlight"></div>
    <svg class="ambient-orbit" viewBox="0 0 600 600" fill="none">
      <circle class="orbit-ring orbit-ring-outer" cx="300" cy="300" r="260" />
      <circle class="orbit-ring orbit-ring-mid" cx="300" cy="300" r="185" />
      <circle class="orbit-ring orbit-ring-inner" cx="300" cy="300" r="110" />
    </svg>
  </div>

  <div class="page">
    <header class="header animate-stage" style="--stage-index: 0;">
      <a href="/" class="brand" aria-label="Gravity home">
        <span class="brand-dot" aria-hidden="true">
          <svg class="brand-mark-svg" viewBox="0 0 24 24" fill="none">
            <circle class="brand-orbit-ring" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
            <circle class="brand-core" cx="12" cy="12" r="4" fill="currentColor" />
            <circle class="brand-satellite" cx="18.5" cy="5.5" r="1.75" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-name">Gravity</span>
        <span class="brand-badge" aria-hidden="true">v0.6</span>
      </a>
      <nav class="header-nav" aria-label="Account navigation">
        <a href="/auth" class="header-link" id="header-signin-link">Sign in</a>
        <a href="/auth?mode=signup" class="btn btn-secondary btn-sm header-cta" id="header-signup-link">
          <span>Sign up</span>
          <svg class="icon icon-xs icon-nudge-right" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8H12.5M12.5 8L8.75 4.25M12.5 8L8.75 11.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>
    </header>

    <main class="main">
      <section class="section" aria-labelledby="shorten-title">
        <div class="hero-intro">
          <div class="eyebrow animate-stage" style="--stage-index: 1;">
            <span class="eyebrow-pulse" aria-hidden="true"></span>
            <span class="eyebrow-text">Precision Link Compression</span>
          </div>
          <h1 id="shorten-title" class="title animate-stage" style="--stage-index: 2;">Shorten a link</h1>
          <p class="subtitle animate-stage" style="--stage-index: 3;">Paste a long URL to create a short, shareable link with instant redirection.</p>
        </div>

        <form id="shorten-form" class="shorten-form animate-stage" style="--stage-index: 4;" novalidate>
          <label for="shorten-input" class="sr-only">Destination URL</label>
          <div class="command-shell" id="shorten-shell">
            <div class="input-row">
              <div class="input-wrapper">
                <span class="input-leading-icon" id="url-status-icon" aria-hidden="true">
                  <svg class="icon icon-sm" viewBox="0 0 16 16" fill="none">
                    <path d="M6.75 9.25L9.25 6.75M5.5 11.5L4.25 12.75C3.2835 13.7165 1.7165 13.7165 0.75 12.75C-0.2165 11.7835 -0.2165 10.2165 0.75 9.25L2.75 7.25C3.7165 6.2835 5.2835 6.2835 6.25 7.25M10.5 4.5L11.75 3.25C12.7165 2.2835 14.2835 2.2835 15.25 3.25C16.2165 4.2165 16.2165 5.7835 15.25 6.75L13.25 8.75C12.2835 9.7165 10.7165 9.7165 9.75 8.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(1 1) scale(0.88)"/>
                  </svg>
                </span>
                <input
                  type="url"
                  id="shorten-input"
                  name="original_url"
                  class="input command-input"
                  placeholder="https://example.com/very/long/url"
                  autocomplete="url"
                  autocapitalize="off"
                  spellcheck="false"
                  required
                >
                <div class="input-trailing">
                  <kbd class="kbd-shortcut" id="input-kbd-hint" aria-hidden="true" title="Press / to focus">/</kbd>
                  <button
                    type="button"
                    id="clear-input-btn"
                    class="clear-btn"
                    aria-label="Clear URL input"
                    hidden
                  >
                    <svg class="icon icon-xs" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              <button type="submit" id="shorten-submit" class="btn btn-primary command-submit">
                <span class="btn-label" id="shorten-submit-label">Shorten</span>
                <span class="btn-icon" aria-hidden="true">
                  <svg class="icon icon-sm icon-submit-arrow" viewBox="0 0 16 16" fill="none">
                    <path d="M3.25 8H12.75M12.75 8L8.75 4M12.75 8L8.75 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <svg class="icon icon-sm icon-spinner" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.75"/>
                    <path d="M14 8C14 4.68629 11.3137 2 8 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <p id="shorten-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        </form>

        <!-- Primary Shortened URL Monolith Card -->
        <div id="output-result" class="result-card" aria-live="polite" hidden>
          <div class="result-sheen" aria-hidden="true"></div>
          <div class="result-top-bar">
            <div class="result-status">
              <span class="result-status-dot" aria-hidden="true"></span>
              <span class="result-status-label">Short link ready</span>
            </div>
            <span id="result-compression-badge" class="result-badge">Direct 302</span>
          </div>

          <div class="result-body">
            <div class="result-main">
              <a
                id="result-short-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="result-link"
              ></a>
              <div class="result-orig-row">
                <span class="result-orig-arrow" aria-hidden="true">&hookrightarrow;</span>
                <p id="result-orig-url" class="result-original"></p>
              </div>
            </div>
            <div class="result-actions">
              <button type="button" id="copy-btn" class="btn btn-light btn-sm copy-action-btn">
                <span class="copy-icon-stack" aria-hidden="true">
                  <svg class="icon icon-xs icon-clipboard" viewBox="0 0 16 16" fill="none">
                    <rect x="5.25" y="5.25" width="8.25" height="8.25" rx="1.75" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M10.75 5.25V3.5C10.75 2.80964 10.1904 2.25 9.5 2.25H3.5C2.80964 2.25 2.25 2.80964 2.25 3.5V9.5C2.25 10.1904 2.80964 10.75 3.5 10.75H5.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                  <svg class="icon icon-xs icon-check" viewBox="0 0 16 16" fill="none">
                    <path d="M3.25 8.25L6.5 11.5L12.75 4.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <span class="copy-btn-text" id="copy-btn-text">Copy</span>
              </button>
              <a
                id="test-redirect-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-dark-ghost btn-sm visit-action-btn"
              >
                <span>Visit</span>
                <svg class="icon icon-xs icon-external" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.75M11.5 4.5V10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </div>
          </div>
        </div>

        <!-- Session History Tray (Appears when multiple links are shortened) -->
        <div id="session-history" class="history-tray" aria-label="Recent links in this session" hidden>
          <div class="history-header">
            <span class="history-title">Session history</span>
            <button type="button" id="clear-history-btn" class="text-btn">Clear</button>
          </div>
          <ul id="history-list" class="history-list"></ul>
        </div>
      </section>
    </main>

    <footer class="footer animate-stage" style="--stage-index: 5;">
      <div class="footer-inner">
        <span class="footer-brand">Gravity</span>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <span class="footer-hint">Press <kbd class="kbd-inline">/</kbd> to focus input</span>
      </div>
    </footer>
  </div>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
