<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gravity — Minimalist URL shortener.">
  <meta name="theme-color" content="#0A0A0A">
  <title>Gravity</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Gravity</span>
      </a>
      <a href="#auth-section" class="header-link" id="header-auth-link">Sign in</a>
    </header>

    <main class="main">
      <!-- URL Shortener -->
      <section class="section" aria-labelledby="shorten-title">
        <h1 id="shorten-title" class="title">Shorten a link</h1>
        <p class="subtitle">Paste a long URL to create a short, shareable link.</p>

        <form id="shorten-form" class="shorten-form" novalidate>
          <label for="shorten-input" class="sr-only">Destination URL</label>
          <div class="input-row">
            <input
              type="url"
              id="shorten-input"
              name="original_url"
              class="input"
              placeholder="https://example.com/very/long/url"
              autocomplete="url"
              autocapitalize="off"
              spellcheck="false"
              required
            >
            <button type="submit" id="shorten-submit" class="btn btn-primary">
              Shorten
            </button>
          </div>

          <p id="shorten-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        </form>

        <!-- Result -->
        <div id="output-result" class="result-card" aria-live="polite" hidden>
          <div class="result-main">
            <a
              id="result-short-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="result-link"
            ></a>
            <p id="result-orig-url" class="result-original"></p>
          </div>
          <div class="result-actions">
            <button type="button" id="copy-btn" class="btn btn-primary btn-sm">
              Copy
            </button>
            <a
              id="test-redirect-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-secondary btn-sm"
            >
              Visit
            </a>
          </div>
        </div>
      </section>

      <hr class="divider">

      <!-- Authentication -->
      <section class="section" id="auth-section" aria-labelledby="auth-title">
        <div class="auth-header">
          <h2 id="auth-title" class="section-title">Account</h2>
          <div class="tabs" role="tablist" aria-label="Account access">
            <button
              type="button"
              role="tab"
              id="tab-signin"
              class="tab is-active"
              aria-selected="true"
              aria-controls="auth-form-panel"
            >
              Sign in
            </button>
            <button
              type="button"
              role="tab"
              id="tab-signup"
              class="tab"
              aria-selected="false"
              aria-controls="auth-form-panel"
            >
              Sign up
            </button>
          </div>
        </div>

        <!-- Signed-in state -->
        <div id="auth-active-panel" class="signed-in-box" hidden>
          <p class="signed-in-text">
            Signed in as <strong id="session-user-email"></strong>
          </p>
          <button type="button" id="auth-switch-btn" class="btn btn-secondary btn-sm">
            Switch account
          </button>
        </div>

        <!-- Sign in / Sign up form -->
        <div id="auth-form-panel" role="tabpanel" aria-labelledby="tab-signin">
          <form id="auth-form" class="auth-form" novalidate>
            <div class="field">
              <label for="auth-email" class="label">Email</label>
              <input
                type="email"
                id="auth-email"
                name="email"
                class="input"
                placeholder="you@example.com"
                autocomplete="email"
                autocapitalize="off"
                spellcheck="false"
                required
              >
            </div>

            <div class="field">
              <div class="label-row">
                <label for="auth-password" class="label">Password</label>
                <button
                  type="button"
                  id="toggle-password-btn"
                  class="text-btn"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
              <input
                type="password"
                id="auth-password"
                name="password"
                class="input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
            </div>

            <button type="submit" id="auth-submit" class="btn btn-primary btn-block">
              Sign in
            </button>

            <p id="auth-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Gravity</span>
    </footer>
  </div>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
