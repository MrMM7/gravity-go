<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create a Gravity account.">
  <meta name="theme-color" content="#09090B">
  <title>Account — Gravity</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090B'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23FFFFFF' stroke-opacity='0.28' stroke-width='1.25'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23FFFFFF'/%3E%3Ccircle cx='23.5' cy='9.5' r='1.75' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Atmospheric Monochrome Background Layer -->
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-spotlight"></div>
    <svg class="ambient-orbit" viewBox="0 0 600 600" fill="none">
      <circle class="orbit-ring orbit-ring-outer" cx="300" cy="300" r="260" />
      <circle class="orbit-ring orbit-ring-mid" cx="300" cy="300" r="185" />
      <circle class="orbit-ring orbit-ring-inner" cx="300" cy="300" r="110" />
    </svg>
  </div>

  <div class="page">
    <header class="header animate-stage" style="--stage-index: 0;">
      <a href="/" class="brand" aria-label="Gravity home">
        <span class="brand-dot" aria-hidden="true">
          <svg class="brand-mark-svg" viewBox="0 0 24 24" fill="none">
            <circle class="brand-orbit-ring" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
            <circle class="brand-core" cx="12" cy="12" r="4" fill="currentColor" />
            <circle class="brand-satellite" cx="18.5" cy="5.5" r="1.75" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-name">Gravity</span>
        <span class="brand-badge" aria-hidden="true">v0.6</span>
      </a>
      <nav class="header-nav" aria-label="Return navigation">
        <a href="/" class="header-link back-link">
          <svg class="icon icon-xs icon-nudge-left" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M12.5 8H3.5M3.5 8L7.25 4.25M3.5 8L7.25 11.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back to shortener</span>
        </a>
      </nav>
    </header>

    <main class="main">
      <section class="section auth-page-section" aria-labelledby="auth-title">
        <div class="auth-card animate-stage" style="--stage-index: 1;" id="auth-card">
          <div class="auth-header">
            <div class="auth-title-group" id="auth-title-group">
              <div class="eyebrow">
                <span class="eyebrow-pulse" aria-hidden="true"></span>
                <span class="eyebrow-text" id="auth-eyebrow-text">Account Access</span>
              </div>
              <h1 id="auth-title" class="title auth-heading">Sign in</h1>
              <p id="auth-subtitle" class="subtitle">Enter your email and password to continue.</p>
            </div>

            <div class="tabs" role="tablist" aria-label="Account mode" data-active-mode="signin" id="auth-tabs">
              <span class="tab-indicator" aria-hidden="true"></span>
              <button
                type="button"
                role="tab"
                id="tab-signin"
                class="tab is-active"
                aria-selected="true"
                aria-controls="auth-form-panel"
              >
                Sign in
              </button>
              <button
                type="button"
                role="tab"
                id="tab-signup"
                class="tab"
                aria-selected="false"
                aria-controls="auth-form-panel"
              >
                Sign up
              </button>
            </div>
          </div>

          <div id="auth-form-panel" class="auth-form-panel" role="tabpanel" aria-labelledby="tab-signin">
            <form id="auth-form" class="auth-form" novalidate>
              <div class="field animate-stage" style="--stage-index: 2;">
                <label for="auth-email" class="label">Email address</label>
                <div class="field-input-shell">
                  <span class="field-leading-icon" aria-hidden="true">
                    <svg class="icon icon-sm" viewBox="0 0 16 16" fill="none">
                      <rect x="1.75" y="3.25" width="12.5" height="9.5" rx="2" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M2.25 4.25L8 8.25L13.75 4.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <input
                    type="email"
                    id="auth-email"
                    name="email"
                    class="input field-input"
                    placeholder="you@example.com"
                    autocomplete="email"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                  >
                </div>
              </div>

              <div class="field animate-stage" style="--stage-index: 3;">
                <div class="label-row">
                  <label for="auth-password" class="label">Password</label>
                  <button
                    type="button"
                    id="toggle-password-btn"
                    class="text-btn password-toggle-btn"
                    aria-pressed="false"
                  >
                    <span class="password-toggle-icons" aria-hidden="true">
                      <svg class="icon icon-xs icon-eye" viewBox="0 0 16 16" fill="none">
                        <path d="M1.5 8C2.8 4.8 5.2 3.25 8 3.25C10.8 3.25 13.2 4.8 14.5 8C13.2 11.2 10.8 12.75 8 12.75C5.2 12.75 2.8 11.2 1.5 8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                        <circle cx="8" cy="8" r="2.25" stroke="currentColor" stroke-width="1.4"/>
                      </svg>
                      <svg class="icon icon-xs icon-eye-off" viewBox="0 0 16 16" fill="none">
                        <path d="M2.5 2.5L13.5 13.5M6.6 6.65C6.08 7.02 5.75 7.62 5.75 8.3C5.75 9.4 6.65 10.3 7.75 10.3C8.43 10.3 9.03 9.97 9.4 9.45M4.1 4.25C2.95 5.12 2.05 6.38 1.5 8C2.8 11.2 5.2 12.75 8 12.75C9.45 12.75 10.78 12.33 11.9 11.55M14.5 8C13.62 5.85 11.9 4.25 9.75 3.55" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    <span class="password-toggle-label" id="toggle-password-label">Show</span>
                  </button>
                </div>
                <div class="field-input-shell">
                  <span class="field-leading-icon" aria-hidden="true">
                    <svg class="icon icon-sm" viewBox="0 0 16 16" fill="none">
                      <rect x="3" y="7.25" width="10" height="6.75" rx="1.75" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M5.25 7.25V5C5.25 3.48122 6.48122 2.25 8 2.25C9.51878 2.25 10.75 3.48122 10.75 5V7.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <input
                    type="password"
                    id="auth-password"
                    name="password"
                    class="input field-input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  >
                </div>
              </div>

              <div class="auth-submit-wrap animate-stage" style="--stage-index: 4;">
                <button type="submit" id="auth-submit" class="btn btn-primary btn-block auth-submit-btn">
                  <span class="btn-label" id="auth-submit-label">Sign in</span>
                  <span class="btn-icon" aria-hidden="true">
                    <svg class="icon icon-sm icon-submit-arrow" viewBox="0 0 16 16" fill="none">
                      <path d="M3.25 8H12.75M12.75 8L8.75 4M12.75 8L8.75 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="icon icon-sm icon-spinner" viewBox="0 0 16 16" fill="none">
                      <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.75"/>
                      <path d="M14 8C14 4.68629 11.3137 2 8 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                    </svg>
                  </span>
                </button>
              </div>

              <p id="auth-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer animate-stage" style="--stage-index: 5;">
      <div class="footer-inner">
        <span class="footer-brand">Gravity</span>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <span class="footer-hint">End-to-end Argon2id + JWT authentication</span>
      </div>
    </footer>
  </div>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
